name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[test]"
      - run: pytest tests/ -v
      - name: smoke the installer one-liner
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $env:CROSSWEAVE_REPO_DIR = Join-Path $env:RUNNER_TEMP "cw-repo"
          $env:CROSSWEAVE_BIN_DIR = Join-Path $env:RUNNER_TEMP "cw-bin"
          # Clone the checkout itself, so the smoke exercises THIS commit end
          # to end: irm|iex runs the checkout's installer, the installer
          # clones the checkout, and the launcher runs the clone. This is
          # the exact path the README promises, and it is where the
          # execution-policy break lived (a re-invocation through & file.ps1
          # dies on Restricted -- the factory default).
          $env:CROSSWEAVE_REPO_URL = "file:///" + ($env:GITHUB_WORKSPACE -replace '\\', '/')
          iex (Get-Content -Raw ./install.ps1)
          $v = & (Join-Path $env:CROSSWEAVE_BIN_DIR "cw.cmd") --version
          Write-Host "launcher reported: $v"
          if ($v -notmatch '^crossweave \d') { throw "unexpected launcher output: $v" }
      - name: build the xweave forwarding package
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        run: |
          pip install build
          python -m build packaging/xweave
          # not installed: its dependency on crossweave would pull the
          # published 0.3.0 from PyPI, not this checkout. Building is the
          # contract -- metadata lands in the wheel, nothing runs from it.
          python - <<'EOF'
          import zipfile, glob
          wheel = glob.glob("packaging/xweave/dist/*.whl")[0]
          meta = zipfile.ZipFile(wheel).read("xweave-0.4.0.dist-info/METADATA").decode()
          assert "Requires-Dist: crossweave>=0.4.0" in meta, meta
          print("wheel METADATA carries the forwarding dependency")
          EOF
